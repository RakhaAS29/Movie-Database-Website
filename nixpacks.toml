# Disable auto-detection
[providers]
providers = []

[phases.setup]
nixPkgs = ['php84', 'php84Extensions.pdo', 'php84Extensions.pdo_mysql', 'php84Extensions.mbstring']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader --no-scripts']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'